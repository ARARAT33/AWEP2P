name: AWEp2P Workspace CI

on:
  push:
    branches: [main, 'fix/ci-rustfmt-ebc151f']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'

permissions:
  contents: write

jobs:
  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt fixes
        run: cargo fmt --all
      - name: Persist rustfmt fixes on repair branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/ci-rustfmt-ebc151f' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- core apps platforms
          if git diff --cached --quiet; then
            echo 'No rustfmt changes to persist.'
            exit 0
          fi
          git commit -m 'chore: apply rustfmt to AWEp2P Rust sources'
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  architecture:
    name: Architecture integrity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reject unfinished markers
        shell: bash
        run: |
          if grep -RInE 'TODO|FIXME|IMPLEMENT_ME|UNIMPLEMENTED|fake implementation|mock networking' core apps platforms --exclude-dir=target; then
            echo 'Unfinished implementation marker found.'
            exit 1
          fi
      - name: Verify required platform boundaries
        run: |
          test -f platforms/windows/service.rs
          test -f platforms/linux/daemon.rs
          test -f platforms/android/AndroidManifest.xml
          test -f platforms/aweos/README.md
          test -f core/src/network.rs
          test -f core/src/storage.rs
          test -f core/src/host.rs
          test -f core/src/store.rs
          test -f core/src/messenger.rs
          test -f core/src/registry.rs
