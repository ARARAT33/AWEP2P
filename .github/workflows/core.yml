name: AWEp2P Workspace CI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awep2p-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
      - name: Check Rust workspace formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo check --workspace --all-targets
      - name: Run unit and integration tests
        run: cargo test --workspace --all-targets
      - name: Run product smoke test
        run: cargo test -p awe-node --test product_smoke -- --nocapture
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  architecture:
    name: Architecture integrity checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - name: Reject unfinished markers
        shell: bash
        run: |
          if grep -RInE 'TODO|FIXME|IMPLEMENT_ME|UNIMPLEMENTED|fake implementation|mock networking|WASM Executed Successfully|signature\.len\(\) >= 16|target_service: _|ND-[0-9A-F]{4}-1000' core apps platforms --exclude-dir=target; then
            echo 'Unfinished implementation marker found.'
            exit 1
          fi
      - name: Verify required platform boundaries
        shell: bash
        run: |
          set -euo pipefail
          required=(
            platforms/windows/service.rs
            platforms/linux/daemon.rs
            platforms/android/AndroidManifest.xml
            platforms/aweos/README.md
            core/src/network.rs
            core/src/storage.rs
            core/src/host.rs
            core/src/store.rs
            core/src/messenger.rs
            core/src/registry.rs
            core/src/policy.rs
            core/src/messenger_runtime.rs
            core/src/nat.rs
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required boundary: $path"; exit 1; }
          done
