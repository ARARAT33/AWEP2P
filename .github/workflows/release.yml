name: AWEp2P Release Packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub Release from the selected tag
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  package-windows:
    name: Windows x86_64 executable
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows x86_64
        run: cargo build --release -p awe-node --target x86_64-pc-windows-msvc
      - name: Validate executable
        shell: pwsh
        run: |
          if (!(Test-Path 'target/x86_64-pc-windows-msvc/release/awe-node.exe')) { throw 'Windows executable was not produced' }
          & 'target/x86_64-pc-windows-msvc/release/awe-node.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable failed its startup/help check' }
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/awe-node.exe' 'dist/awep2p-windows-x86_64.exe'
          (Get-FileHash 'dist/awep2p-windows-x86_64.exe' -Algorithm SHA256).Hash.ToLower() + '  awep2p-windows-x86_64.exe' | Set-Content 'dist/awep2p-windows-x86_64.exe.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/awep2p-windows-x86_64.exe*
          if-no-files-found: error

  package-linux:
    name: Linux x86_64 executable
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux x86_64
        run: cargo build --release -p awe-node --target x86_64-unknown-linux-gnu
      - name: Validate executable
        run: |
          test -x target/x86_64-unknown-linux-gnu/release/awe-node
          target/x86_64-unknown-linux-gnu/release/awe-node --help
      - name: Prepare release files
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/awe-node dist/awep2p-linux-x86_64
          chmod +x dist/awep2p-linux-x86_64
          sha256sum dist/awep2p-linux-x86_64 > dist/awep2p-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/awep2p-linux-x86_64*
          if-no-files-found: error

  package-android:
    name: Android installable APK (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            name: android-arm64
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            name: android-armv7
          - target: x86_64-linux-android
            abi: x86_64
            name: android-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools and NDK
        shell: bash
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case '${{ matrix.target }}' in
            aarch64-linux-android)
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
              echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
              echo "AR_aarch64_linux_android=$NDK/llvm-ar" >> "$GITHUB_ENV" ;;
            armv7-linux-androideabi)
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK/armv7a-linux-androideabi35-clang" >> "$GITHUB_ENV"
              echo "CC_armv7_linux_androideabi=$NDK/armv7a-linux-androideabi35-clang" >> "$GITHUB_ENV"
              echo "AR_armv7_linux_androideabi=$NDK/llvm-ar" >> "$GITHUB_ENV" ;;
            x86_64-linux-android)
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK/x86_64-linux-android35-clang" >> "$GITHUB_ENV"
              echo "CC_x86_64_linux_android=$NDK/x86_64-linux-android35-clang" >> "$GITHUB_ENV"
              echo "AR_x86_64_linux_android=$NDK/llvm-ar" >> "$GITHUB_ENV" ;;
          esac
      - name: Build Android native executable
        run: cargo build --release -p awe-node --target ${{ matrix.target }}
      - name: Build real Android APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/android-build"
          mkdir -p "$ROOT/src/com/awep2p" "$ROOT/res/values" "$ROOT/assets" "$ROOT/build"
          cp "target/${{ matrix.target }}/release/awe-node" "$ROOT/assets/awe-node"
          chmod 700 "$ROOT/assets/awe-node"

          cat > "$ROOT/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.awep2p">
            <application android:theme="@style/AppTheme" android:label="AWEp2P" android:allowBackup="false" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "$ROOT/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#6750A4</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/src/com/awep2p/MainActivity.java" <<'EOF'
          package com.awep2p;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.view.Gravity;
          import java.io.*;

          public final class MainActivity extends Activity {
            private TextView status;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              status = new TextView(this);
              status.setGravity(Gravity.CENTER);
              status.setTextSize(18);
              status.setText("AWEp2P\nStarting…");
              setContentView(status);
              new Thread(this::launchNode).start();
            }
            private void launchNode() {
              try {
                File node = new File(getFilesDir(), "awe-node");
                if (!node.exists()) copyAsset("awe-node", node);
                node.setExecutable(true, true);
                Process p = new ProcessBuilder(node.getAbsolutePath()).redirectErrorStream(true).start();
                BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                StringBuilder out = new StringBuilder("AWEp2P\n");
                String line;
                while ((line = r.readLine()) != null) {
                  if (out.length() < 12000) out.append(line).append('\n');
                  final String text = out.toString();
                  runOnUiThread(() -> status.setText(text));
                }
                int code = p.waitFor();
                final String text = out.append("\nExited: ").append(code).toString();
                runOnUiThread(() -> status.setText(text));
              } catch (Exception e) {
                runOnUiThread(() -> status.setText("AWEp2P failed to start\n" + e));
              }
            }
            private void copyAsset(String name, File dest) throws IOException {
              try (InputStream in = getAssets().open(name); OutputStream out = new FileOutputStream(dest)) {
                byte[] b = new byte[65536]; int n;
                while ((n = in.read(b)) != -1) out.write(b, 0, n);
              }
            }
          }
          EOF

          SDK="$ANDROID_SDK_ROOT"
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          mkdir -p "$ROOT/build/classes"
          javac -source 8 -target 8 -classpath "$PLATFORM" -d "$ROOT/build/classes" "$ROOT/src/com/awep2p/MainActivity.java"
          "$BT/d8" --min-api 23 --output "$ROOT/build" "$ROOT/build/classes/com/awep2p/MainActivity.class"
          "$BT/aapt2" compile --dir "$ROOT/res" -o "$ROOT/build/res.zip"
          "$BT/aapt2" link -o "$ROOT/build/unsigned.apk" --manifest "$ROOT/AndroidManifest.xml" -I "$PLATFORM" "$ROOT/build/res.zip"
          cd "$ROOT"
          zip -q -r build/unsigned.apk assets
          zip -q build/unsigned.apk classes.dex
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -v -keystore build/awep2p-release.jks -storepass android -keypass android -alias awep2p -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=AWEp2P, O=AWE, C=AM'
          "$BT/apksigner" sign --ks build/awep2p-release.jks --ks-pass pass:android --key-pass pass:android --out build/awep2p-${{ matrix.name }}.apk build/aligned.apk
          "$BT/apksigner" verify --verbose build/awep2p-${{ matrix.name }}.apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/awep2p-${{ matrix.name }}.apk "$GITHUB_WORKSPACE/dist/"
          sha256sum "$GITHUB_WORKSPACE/dist/awep2p-${{ matrix.name }}.apk" > "$GITHUB_WORKSPACE/dist/awep2p-${{ matrix.name }}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/awep2p-${{ matrix.name }}.apk*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [package-windows, package-linux, package-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets are real files
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/awep2p-windows-x86_64.exe
          test -s release-assets/awep2p-linux-x86_64
          test -s release-assets/awep2p-android-arm64.apk
          test -s release-assets/awep2p-android-armv7.apk
          test -s release-assets/awep2p-android-x86_64.apk
          file release-assets/awep2p-windows-x86_64.exe release-assets/awep2p-linux-x86_64 release-assets/*.apk
          ls -lah release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AWEp2P ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
