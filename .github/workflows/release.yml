name: AWEp2P Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  package-windows:
    name: Windows x64 node package
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native node
        run: cargo build --release -p awe-node
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/awep2p-windows-x64 | Out-Null
          Copy-Item target/release/awe-node.exe dist/awep2p-windows-x64/awe-node.exe
          Copy-Item README.md dist/awep2p-windows-x64/README.md
          Compress-Archive -Path dist/awep2p-windows-x64/* -DestinationPath dist/awep2p-windows-x64.zip -Force
          Get-FileHash dist/awep2p-windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  awep2p-windows-x64.zip" } | Set-Content dist/awep2p-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/awep2p-windows-x64.zip*
          if-no-files-found: error

  package-linux:
    name: Linux x64 node package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native node
        run: cargo build --release -p awe-node
      - name: Stage package
        run: |
          mkdir -p dist/awep2p-linux-x64
          cp target/release/awe-node dist/awep2p-linux-x64/awe-node
          cp README.md dist/awep2p-linux-x64/README.md
          tar -C dist -czf dist/awep2p-linux-x64.tar.gz awep2p-linux-x64
          sha256sum dist/awep2p-linux-x64.tar.gz > dist/awep2p-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/awep2p-linux-x64.tar.gz*
          if-no-files-found: error

  package-android:
    name: Android application source package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage Android source
        run: |
          mkdir -p dist/awep2p-android-source
          cp -a platforms/android dist/awep2p-android-source/android
          cp -a core dist/awep2p-android-source/core
          cp README.md dist/awep2p-android-source/README.md
          (cd dist && zip -qr awep2p-android-source.zip awep2p-android-source)
          sha256sum dist/awep2p-android-source.zip > dist/awep2p-android-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-source
          path: dist/awep2p-android-source.zip*
          if-no-files-found: error

  package-aweos:
    name: AWEOS integration package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage AWEOS integration
        run: |
          mkdir -p dist/awep2p-aweos-integration
          cp -a platforms/aweos dist/awep2p-aweos-integration/aweos
          cp -a core dist/awep2p-aweos-integration/core
          cp README.md dist/awep2p-aweos-integration/README.md
          tar -C dist -czf dist/awep2p-aweos-integration.tar.gz awep2p-aweos-integration
          sha256sum dist/awep2p-aweos-integration.tar.gz > dist/awep2p-aweos-integration.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aweos-integration
          path: dist/awep2p-aweos-integration.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [package-windows, package-linux, package-android, package-aweos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten release assets
        run: |
          mkdir -p release
          find release-assets -type f -exec cp {} release/ \;
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
