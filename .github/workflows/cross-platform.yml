name: AWEp2P Cross-Platform Product

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'awe-desktop/**'
      - 'platforms/**'
      - '.github/workflows/**'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awep2p-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: awe-node.exe
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: awe-node
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: awe-node
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: awe-node
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: awe-node

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}
      - name: Build AWEp2P node
        run: cargo build --release -p awe-node --target ${{ matrix.target }}
      - name: Prepare bundled node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/awe-app/src-tauri/binaries
          source="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          destination="apps/awe-app/src-tauri/binaries/awe-node-${{ matrix.target }}${{ startsWith(matrix.runner, 'windows') && '.exe' || '' }}"
          test -f "$source"
          cp "$source" "$destination"
      - name: Install app dependencies
        working-directory: apps/awe-app
        run: npm install --no-audit --no-fund
      - name: Build native app
        working-directory: apps/awe-app
        run: npx tauri build --ci
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-${{ matrix.target }}
          path: apps/awe-app/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK/AAB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install app dependencies
        working-directory: apps/awe-app
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        working-directory: apps/awe-app
        run: npx tauri android init --ci
      - name: Build Android APK
        working-directory: apps/awe-app
        run: npx tauri android build --ci --apk
      - name: Build Android AAB
        working-directory: apps/awe-app
        run: npx tauri android build --ci --aab
      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-Android
          path: |
            apps/awe-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/awe-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          find release -type f \(             -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm'             -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz'             -o -name '*.apk' -o -name '*.aab'           \) -exec cp -f {} publish/ \;
          test -n "$(find publish -maxdepth 1 -type f -print -quit)"
          (cd publish && sha256sum * > SHA256SUMS.txt)
          {
            echo "AWEp2P release ${GITHUB_REF_NAME}"
            echo "Built from commit ${GITHUB_SHA}"
            echo "Artifacts are produced by the cross-platform product workflow."
          } > publish/RELEASE-MANIFEST.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AWEp2P ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: publish/*
