name: AWEp2P Cross-Platform Product


concurrency:
  group: awe-cross-platform-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/awenet-sites-by-id]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: awe-node.exe
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: awe-node
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: awe-node
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: awe-node
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: awe-node

    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build AWEp2P node
        run: cargo build --release -p awe-node --target ${{ matrix.target }}
      - name: Prepare bundled node
        shell: bash
        run: |
          mkdir -p apps/awe-app/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "apps/awe-app/src-tauri/binaries/awe-node-${{ matrix.target }}${{ startsWith(matrix.runner, 'windows') && '.exe' || '' }}"
      - name: Install app dependencies
        working-directory: apps/awe-app
        run: npm install
      - name: Build native app
        working-directory: apps/awe-app
        run: npx tauri build --ci
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-${{ matrix.target }}
          path: apps/awe-app/src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    name: Android APK/AAB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install app dependencies
        working-directory: apps/awe-app
        run: npm install
      - name: Initialize Android project
        working-directory: apps/awe-app
        run: npx tauri android init --ci
      - name: Build Android APK
        working-directory: apps/awe-app
        run: npx tauri android build --ci --apk
      - name: Build Android AAB
        working-directory: apps/awe-app
        run: npx tauri android build --ci --aab
      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-Android
          path: |
            apps/awe-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/awe-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AWEp2P ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.dmg
            release/**/*.app
            release/**/*.deb
            release/**/*.rpm
            release/**/*.AppImage
            release/**/*.apk
            release/**/*.aab
